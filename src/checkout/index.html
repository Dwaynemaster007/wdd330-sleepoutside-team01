<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>

      <form id="checkout-form" name="checkout">
        <fieldset>
          <legend>Customer Name</legend>
          <label
            >First Name:
            <input type="text" name="fname" required autocomplete="given-name"
          /></label>
          <label
            >Last Name:
            <input type="text" name="lname" required autocomplete="family-name"
          /></label>
        </fieldset>

        <fieldset>
          <legend>Address</legend>
          <label
            >Street Address:
            <input
              type="text"
              name="street"
              required
              autocomplete="street-address"
          /></label>
          <label
            >City: <input type="text" name="city" required autocomplete="address-level2"
          /></label>
          <label
            >State:
            <input type="text" name="state" required autocomplete="address-level1"
          /></label>
          <label
            >Zip Code:
            <input
              type="text"
              id="zip"
              name="zip"
              required
              autocomplete="postal-code"
          /></label>
        </fieldset>

        <fieldset>
          <legend>Payment</legend>
          <label
            >Credit Card Number:
            <input
              type="text"
              name="cardNumber"
              required
              autocomplete="cc-number"
              value="1234123412341234"
          /></label>
          <label
            >Expiration Date:
            <input
              type="text"
              name="expiration"
              placeholder="MM/YY"
              required
              autocomplete="cc-exp"
              value="12/27"
          /></label>
          <label
            >Security Code:
            <input
              type="text"
              name="code"
              required
              autocomplete="cc-csc"
              value="123"
          /></label>
        </fieldset>

        <section id="order-summary">
          <h3>Order Summary</h3>
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Shipping: <span id="shipping">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p>
            <strong>Order Total: <span id="order-total">$0.00</span></strong>
          </p>
        </section>

        <button type="submit" id="checkout-btn-submit">Submit Order</button>
      </form>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
